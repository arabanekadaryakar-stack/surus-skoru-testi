<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sürüş Skorunuz Kaç? | arabanekadaryakar.com</title>
<style>
  :root{
    --navy:#1e3a5f;
    --blue:#2563eb;
    --blue-light:#dbeafe;
    --green:#16a34a;
    --amber:#d97706;
    --red:#dc2626;
    --bg:#f8fafc;
    --border:#e2e8f0;
    --text:#1f2937;
    --muted:#64748b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px 14px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  .header{
    background:linear-gradient(135deg,var(--navy),var(--blue));
    color:#fff;
    border-radius:16px;
    padding:28px 24px;
    text-align:center;
    margin-bottom:22px;
  }
  .header h1{margin:0 0 8px;font-size:1.5em;}
  .header p{margin:0;opacity:0.9;font-size:0.95em;}

  .progress-track{
    height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:24px;
  }
  .progress-fill{
    height:100%;background:var(--blue);border-radius:99px;
    transition:width 0.35s ease;width:0%;
  }

  .card{
    background:#fff;border:1px solid var(--border);border-radius:14px;
    padding:24px;margin-bottom:18px;
  }
  .q-count{color:var(--blue);font-weight:bold;font-size:0.85em;margin-bottom:6px;}
  .q-text{font-size:1.15em;font-weight:bold;color:var(--navy);margin:0 0 18px;}
  .option{
    display:block;width:100%;text-align:left;
    background:var(--bg);border:2px solid var(--border);border-radius:10px;
    padding:13px 16px;margin-bottom:10px;font-size:0.98em;color:var(--text);
    cursor:pointer;transition:all 0.15s ease;
  }
  .option:hover{border-color:var(--blue);background:var(--blue-light);}
  .option.selected{border-color:var(--blue);background:var(--blue-light);font-weight:bold;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .btn{
    border:none;border-radius:8px;padding:12px 22px;font-size:0.95em;font-weight:bold;
    cursor:pointer;transition:opacity 0.15s;
  }
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover:not(:disabled){opacity:0.9;}
  .btn-ghost{background:transparent;color:var(--muted);}

  .result{display:none;text-align:center;}
  .score-ring-wrap{position:relative;width:180px;height:180px;margin:10px auto 6px;}
  .score-num{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:2.2em;font-weight:bold;color:var(--navy);
  }
  .score-label{font-size:1.2em;font-weight:bold;margin:10px 0 4px;}
  .score-sub{color:var(--muted);font-size:0.95em;margin-bottom:24px;}

  .breakdown{text-align:left;margin:22px 0;}
  .b-row{margin-bottom:14px;}
  .b-title{font-size:0.92em;font-weight:bold;color:var(--text);margin-bottom:5px;display:flex;justify-content:space-between;}
  .b-track{height:10px;background:var(--border);border-radius:99px;overflow:hidden;}
  .b-fill{height:100%;border-radius:99px;}

  .tips{
    text-align:left;background:#f0fdf4;border-left:5px solid var(--green);
    border-radius:8px;padding:16px 18px;margin:20px 0;
  }
  .tips h3{margin:0 0 10px;color:var(--navy);font-size:1.05em;}
  .tips ul{margin:0;padding-left:20px;}
  .tips li{margin-bottom:8px;font-size:0.95em;}

  .cta{
    background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;
    padding:22px;border-radius:12px;margin-top:26px;
  }
  .cta p{margin:0 0 12px;font-size:1em;}
  .cta a{
    display:inline-block;background:#fff;color:var(--navy);
    padding:11px 24px;border-radius:6px;text-decoration:none;font-weight:bold;
  }
  .retry{margin-top:16px;}
  .retry button{background:none;border:none;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:0.9em;}

  @media (max-width:420px){
    .card{padding:18px;}
    .q-text{font-size:1.05em;}
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <h1>🚗 Sürüş Skorunuz Kaç?</h1>
    <p>8 soruda sürüş alışkanlıklarınızı ölçün, yakıt/enerji tasarrufu potansiyelinizi görün.</p>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div id="quizArea"></div>

  <div class="card result" id="resultCard">
    <div class="q-text" style="text-align:center;">Sonucunuz</div>
    <div class="score-ring-wrap">
      <svg viewBox="0 0 120 120" width="180" height="180">
        <circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="12"/>
        <circle id="scoreCircle" cx="60" cy="60" r="52" fill="none" stroke="#2563eb" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"
          transform="rotate(-90 60 60)"/>
      </svg>
      <div class="score-num" id="scoreNum">0%</div>
    </div>
    <div class="score-label" id="scoreLabel"></div>
    <div class="score-sub" id="scoreSub"></div>

    <div class="breakdown" id="breakdown"></div>

    <div class="tips" id="tipsBox">
      <h3>💡 Size özel öneriler</h3>
      <ul id="tipsList"></ul>
    </div>

    <div class="cta">
      <p><strong>Yeni alışkanlıklarınızla gerçek tasarrufunuzu hesaplayın</strong></p>
      <a href="https://www.arabanekadaryakar.com/" target="_blank" rel="noopener">Ücretsiz Yakıt/Enerji Maliyeti Hesaplama Aracını Kullan</a>
    </div>

    <div class="retry"><button onclick="restartQuiz()">🔄 Testi tekrar çöz</button></div>
  </div>

</div>

<script>
const questions = [
  {
    id: "hizlanma",
    category: "Hızlanma tarzı",
    text: "Trafik ışığı yeşile döndüğünde genelde nasıl hızlanırsınız?",
    options: [
      { text: "Hızlıca ve sertçe gaza basarım", points: 0 },
      { text: "Orta tempoda hızlanırım", points: 2 },
      { text: "Yumuşak ve kademeli hızlanırım", points: 3 }
    ]
  },
  {
    id: "fren",
    category: "Fren tarzı",
    text: "Duracağınız bir noktayı fark ettiğinizde ne yaparsınız?",
    options: [
      { text: "Son ana kadar gidip sert frenlerim", points: 0 },
      { text: "Biraz önceden yavaşlamaya başlarım", points: 2 },
      { text: "Erkenden ayağımı gazdan çekip yavaşça yaklaşırım", points: 3 }
    ]
  },
  {
    id: "hiz",
    category: "Otoyol hızı",
    text: "Otoyolda genelde hangi hız aralığında seyredersiniz?",
    options: [
      { text: "130 km/s ve üzeri", points: 0 },
      { text: "110-130 km/s arası", points: 1 },
      { text: "90-110 km/s arası", points: 3 }
    ]
  },
  {
    id: "lastik",
    category: "Lastik basıncı kontrolü",
    text: "Lastik basıncınızı ne sıklıkla kontrol ettirirsiniz?",
    options: [
      { text: "Hiç kontrol ettirmem / hatırlamıyorum", points: 0 },
      { text: "Birkaç ayda bir", points: 2 },
      { text: "Ayda bir veya daha sık", points: 3 }
    ]
  },
  {
    id: "klima",
    category: "Klima/cam kullanımı",
    text: "Otoyolda sıcak bir günde ne yaparsınız?",
    options: [
      { text: "Camı açık tutarım, klimayı hiç kullanmam", points: 1 },
      { text: "Klimayı açar, makul bir sıcaklıkta tutarım", points: 3 },
      { text: "Klimayı en soğuk ayarda sürekli çalıştırırım", points: 1 }
    ]
  },
  {
    id: "yuk",
    category: "Araç yükü",
    text: "Aracınızda gereksiz yük (bagaj, tavan taşıyıcı vb.) taşır mısınız?",
    options: [
      { text: "Evet, çoğu zaman ihtiyacım olmayan eşyalar da araçtadır", points: 0 },
      { text: "Bazen", points: 2 },
      { text: "Hayır, sadece gerekli olanı taşırım", points: 3 }
    ]
  },
  {
    id: "cruise",
    category: "Hız sabitleyici kullanımı",
    text: "Hız sabitleyiciyi (cruise control) hangi durumda kullanırsınız?",
    options: [
      { text: "Hava/yol durumuna bakmadan her fırsatta kullanırım", points: 0 },
      { text: "Sadece düz, kuru ve akıcı otoyollarda kullanırım", points: 3 },
      { text: "Hiç kullanmam / aracımda yok", points: 1 }
    ]
  },
  {
    id: "bakim",
    category: "Bakım ve rölanti",
    text: "Bakım ve gereksiz rölanti konusunda durumunuz nedir?",
    options: [
      { text: "Bakımları çoğu zaman geciktiririm, uzun süre rölantide beklerim", points: 0 },
      { text: "Bakımları zamanında yaptırırım ama rölantiye dikkat etmem", points: 2 },
      { text: "Bakımlar düzenli, gereksiz rölantiden kaçınırım", points: 3 }
    ]
  }
];

let current = 0;
let answers = new Array(questions.length).fill(null);

function renderQuestion(){
  const q = questions[current];
  const area = document.getElementById('quizArea');
  const pct = Math.round((current / questions.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';

  let optionsHtml = q.options.map((opt, i) => {
    const sel = answers[current] === i ? 'selected' : '';
    return `<button class="option ${sel}" onclick="selectOption(${i})">${opt.text}</button>`;
  }).join('');

  area.innerHTML = `
    <div class="card">
      <div class="q-count">Soru ${current + 1} / ${questions.length} — ${q.category}</div>
      <div class="q-text">${q.text}</div>
      <div id="optionsWrap">${optionsHtml}</div>
      <div class="nav-row">
        <button class="btn btn-ghost" onclick="prevQuestion()" ${current === 0 ? 'disabled' : ''}>← Geri</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" ${answers[current] === null ? 'disabled' : ''}>
          ${current === questions.length - 1 ? 'Sonucu Gör' : 'İleri →'}
        </button>
      </div>
    </div>
  `;
}

function selectOption(i){
  answers[current] = i;
  renderQuestion();
}

function nextQuestion(){
  if(answers[current] === null) return;
  if(current < questions.length - 1){
    current++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion(){
  if(current > 0){
    current--;
    renderQuestion();
  }
}

function showResult(){
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  const resultCard = document.getElementById('resultCard');
  resultCard.style.display = 'block';

  let total = 0, max = 0;
  const catScores = [];
  questions.forEach((q, i) => {
    const pts = q.options[answers[i]].points;
    total += pts;
    max += 3;
    catScores.push({ category: q.category, points: pts, max: 3 });
  });

  const pct = Math.round((total / max) * 100);

  const circumference = 326.7;
  const offset = circumference - (pct / 100) * circumference;
  document.getElementById('scoreCircle').style.strokeDashoffset = offset;
  document.getElementById('scoreNum').textContent = pct + '%';

  let label, sub, color;
  if(pct >= 80){
    label = '🏆 Yakıt Verimliliği Ustası';
    sub = 'Sürüş alışkanlıklarınız zaten oldukça verimli. Küçük ince ayarlarla mükemmelleştirebilirsiniz.';
    color = '#16a34a';
  } else if(pct >= 50){
    label = '⚙️ Ortalama Sürücü';
    sub = 'Fena değil, ama birkaç alışkanlığı değiştirerek belirgin bir tasarruf yakalayabilirsiniz.';
    color = '#d97706';
  } else {
    label = '🔧 Gelişime Açık';
    sub = 'Sürüş tarzınızda yapacağınız değişikliklerle ciddi bir tasarruf potansiyeliniz var.';
    color = '#dc2626';
  }
  document.getElementById('scoreCircle').style.stroke = color;
  document.getElementById('scoreLabel').textContent = label;
  document.getElementById('scoreLabel').style.color = color;
  document.getElementById('scoreSub').textContent = sub;

  const breakdown = document.getElementById('breakdown');
  breakdown.innerHTML = catScores.map(c => {
    const p = Math.round((c.points / c.max) * 100);
    let barColor = p >= 80 ? '#16a34a' : (p >= 40 ? '#d97706' : '#dc2626');
    return `
      <div class="b-row">
        <div class="b-title"><span>${c.category}</span><span>${p}%</span></div>
        <div class="b-track"><div class="b-fill" style="width:${p}%;background:${barColor};"></div></div>
      </div>
    `;
  }).join('');

  const sorted = [...catScores].sort((a,b) => (a.points/a.max) - (b.points/b.max));
  const weakest = sorted.slice(0, 3);

  const tipMap = {
    "Hızlanma tarzı": "Kalkışlarda gaza sertçe basmak yerine kademeli hızlanmayı deneyin; bu tek başına %15'e varan tasarruf sağlayabilir.",
    "Fren tarzı": "Duracağınız noktayı önceden fark edip yavaşça yaklaşmak, ani fren-tekrar hızlanma döngüsünü azaltır.",
    "Otoyol hızı": "Hız, tüketimi kareyle etkiler; 120 km/s yerine 90-100 km/s'de seyretmek büyük fark yaratır.",
    "Lastik basıncı kontrolü": "Ayda bir lastik basıncı kontrolü, tek başına ortalama %5 tasarruf sağlayabilir.",
    "Klima/cam kullanımı": "Şehir içinde cam, otoyolda klima daha verimlidir; yüksek hızda açık cam aerodinamiği bozar.",
    "Araç yükü": "Bagajınızdaki gereksiz yükü ve kullanılmayan tavan taşıyıcıyı kaldırmak, özellikle şehir içinde fark yaratır.",
    "Hız sabitleyici kullanımı": "Hız sabitleyiciyi sadece düz, kuru ve akıcı otoyollarda kullanın; yağmur/kar/viraj/yokuşta kapalı tutun.",
    "Bakım ve rölanti": "Düzenli bakım ve gereksiz rölantiden kaçınmak, aracınızın tasarlandığı verimlilikte çalışmasını sağlar."
  };

  document.getElementById('tipsList').innerHTML = weakest.map(w =>
    `<li><strong>${w.category}:</strong> ${tipMap[w.category]}</li>`
  ).join('');

  resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function restartQuiz(){
  current = 0;
  answers = new Array(questions.length).fill(null);
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  renderQuestion();
}

renderQuestion();
</script>

</body>
</html>
